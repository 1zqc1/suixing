plugins { id 'com.android.application' }

def localSettings = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) { localFile.withInputStream { localSettings.load(it) } }
def mapAk = (localSettings.getProperty('baidu.map.ak') ?: System.getenv('BAIDU_MAP_AK') ?: '').trim()

android {
    namespace 'org.suixing.app'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'org.suixing.app'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
        buildConfigField 'String', 'BAIDU_MAP_AK', '"' + mapAk.replace('\\', '\\\\').replace('"', '\\"') + '"'
        manifestPlaceholders = [BAIDU_MAP_AK: mapAk]
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}

dependencies {
    androidTestCompileOnly files(
            "${android.sdkDirectory}/platforms/android-${android.compileSdk}/optional/android.test.runner.jar",
            "${android.sdkDirectory}/platforms/android-${android.compileSdk}/optional/android.test.base.jar")
    implementation 'com.baidu.lbsyun:BaiduMapSDK_Map:9.0.0'
    implementation 'com.baidu.lbsyun:BaiduMapSDK_Util:9.0.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'junit:junit:4.13.2'
}
